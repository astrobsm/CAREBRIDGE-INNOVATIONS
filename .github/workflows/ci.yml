name: CI

# Gate: type-check and production build on every PR (and on pushes to main).
# Catches type errors before they reach main and before Vercel deploys.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch/PR; cancel superseded runs to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Production build (vite)
        run: npm run build
