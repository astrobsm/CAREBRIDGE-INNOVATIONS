name: CI

# Gate: type-check, unit tests and production build on every PR (and on pushes
# to main). Catches type errors, clinical-logic regressions and frontend/backend
# schema drift before they reach main and before Vercel deploys.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One run per branch/PR; cancel superseded runs to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      # Migrations are replayed in full against a fresh migration history, so a
      # statement that cannot be re-run would block every later migration behind
      # it. Cheap to check here; expensive to discover during a deploy.
      - name: Migrations are safe to re-run
        run: npm run db:check

      # Includes syncTableAlignment, which fails if the frontend sync lists and
      # the Supabase schema drift apart again.
      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (vite)
        run: npm run build
