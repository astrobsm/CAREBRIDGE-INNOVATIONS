name: Supabase migrations

# Auto-applies database migrations to the production Supabase project whenever a
# migration file lands on main. Runs on GitHub's CI (NOT in the Vercel build) so
# it never fires on preview deploys and keeps DB credentials out of the frontend
# build. `supabase db push` only applies migrations not yet recorded in the
# remote migration-history table, so it is safe to run on every push.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  # Lets you run the very first migration manually from the Actions tab.
  workflow_dispatch:

# Never run two migration pushes at once.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending migrations
        # SUPABASE_DB_URL is the full Postgres connection URI (with password),
        # stored as a repository secret. Using --db-url keeps this self-contained
        # (no `supabase link` / config.toml needed).
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
